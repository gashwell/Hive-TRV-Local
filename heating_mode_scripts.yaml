# Global heating mode scripts
# Settings → Scripts → Add script → Edit as YAML — import each one
# These appear as script.* entities you can call from automations or buttons

- alias: Heating — Manual mode
  description: All TRVs hold current setpoint indefinitely. Boiler responds to demand.
  sequence:
    - service: select.select_option
      target:
        entity_id:
          - select.hive_trv_tv_programming_operation_mode
          - select.hive_trv_bay_programming_operation_mode
          - select.hive_trv_dining_programming_operation_mode
          - select.hive_trv_bedroom_programming_operation_mode
          - select.hive_trv_kitchen_programming_operation_mode
          - select.hive_trv_office_programming_operation_mode
          - select.hive_trv_hallway_programming_operation_mode
          - select.hive_trv_entrance_programming_operation_mode
          - select.hive_trv_guestroom_programming_operation_mode
          - select.hive_trv_conservatory_programming_operation_mode
          - select.hive_trv_garage_programming_operation_mode
      data:
        option: setpoint
  mode: single
  icon: mdi:hand-back-right

- alias: Heating — Schedule mode
  description: All TRVs follow their built-in schedule.
  sequence:
    - service: select.select_option
      target:
        entity_id:
          - select.hive_trv_tv_programming_operation_mode
          - select.hive_trv_bay_programming_operation_mode
          - select.hive_trv_dining_programming_operation_mode
          - select.hive_trv_bedroom_programming_operation_mode
          - select.hive_trv_kitchen_programming_operation_mode
          - select.hive_trv_office_programming_operation_mode
          - select.hive_trv_hallway_programming_operation_mode
          - select.hive_trv_entrance_programming_operation_mode
          - select.hive_trv_guestroom_programming_operation_mode
          - select.hive_trv_conservatory_programming_operation_mode
          - select.hive_trv_garage_programming_operation_mode
      data:
        option: schedule
  mode: single
  icon: mdi:calendar-clock

- alias: Heating — Eco mode
  description: All TRVs set to eco (lower setpoints, reduced demand).
  sequence:
    - service: select.select_option
      target:
        entity_id:
          - select.hive_trv_tv_programming_operation_mode
          - select.hive_trv_bay_programming_operation_mode
          - select.hive_trv_dining_programming_operation_mode
          - select.hive_trv_bedroom_programming_operation_mode
          - select.hive_trv_kitchen_programming_operation_mode
          - select.hive_trv_office_programming_operation_mode
          - select.hive_trv_hallway_programming_operation_mode
          - select.hive_trv_entrance_programming_operation_mode
          - select.hive_trv_guestroom_programming_operation_mode
          - select.hive_trv_conservatory_programming_operation_mode
          - select.hive_trv_garage_programming_operation_mode
      data:
        option: eco
  mode: single
  icon: mdi:leaf

- alias: Heating — Off
  description: >
    All TRVs turned off AND boiler switch forced off.
    No heating will occur regardless of TRV demand.
    Re-enable by selecting Manual, Schedule or Eco.
  sequence:
    # Turn all TRVs off
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.hive_trv_tv
          - climate.hive_trv_bay
          - climate.hive_trv_dining
          - climate.hive_trv_bedroom
          - climate.hive_trv_kitchen
          - climate.hive_trv_office
          - climate.hive_trv_hallway
          - climate.hive_trv_entrance
          - climate.hive_trv_guestroom
          - climate.hive_trv_conservatory
          - climate.hive_trv_garage
      data:
        hvac_mode: "off"
    # Force boiler switch off
    - service: switch.turn_off
      target:
        entity_id: switch.boiler_switch
  mode: single
  icon: mdi:radiator-off
