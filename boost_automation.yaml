# Boost automations
# The UK7004240 TRV handles the boost countdown natively in firmware.
# All four fields must be sent in a single MQTT payload — the device
# ignores partial payloads for mode changes.
# To cancel: send system_mode:heat + temperature_setpoint_hold:0

alias: Heating — Apply boost
description: >
  Sends a single MQTT boost payload to all TRVs in the selected room.
  The TRV firmware handles the countdown and cancels itself when done.
mode: restart
trigger:
  - platform: state
    entity_id: input_boolean.heating_boost_active
    to: "on"
variables:
  room: "{{ states('input_select.heating_boost_room') }}"
  duration: "{{ states('input_number.heating_boost_duration') | int }}"
  temperature: "{{ states('input_number.heating_boost_temperature') | float }}"
  room_trvs:
    Living Room:
      - zigbee2mqtt/Hive TRV TV/set
      - zigbee2mqtt/Hive TRV Bay/set
      - zigbee2mqtt/Hive TRV Dining/set
    Bedroom:
      - zigbee2mqtt/Hive TRV Bedroom/set
    Kitchen:
      - zigbee2mqtt/Hive TRV Kitchen/set
    Office:
      - zigbee2mqtt/Hive TRV Office/set
    Hallway:
      - zigbee2mqtt/Hive TRV Hallway/set
    Entrance:
      - zigbee2mqtt/Hive TRV Entrance/set
    Guest Room:
      - zigbee2mqtt/Hive TRV Guestroom/set
    Conservatory:
      - zigbee2mqtt/Hive TRV Conservatory/set
    Garage:
      - zigbee2mqtt/Hive TRV Garage/set
    All Rooms:
      - zigbee2mqtt/Hive TRV TV/set
      - zigbee2mqtt/Hive TRV Bay/set
      - zigbee2mqtt/Hive TRV Dining/set
      - zigbee2mqtt/Hive TRV Bedroom/set
      - zigbee2mqtt/Hive TRV Kitchen/set
      - zigbee2mqtt/Hive TRV Office/set
      - zigbee2mqtt/Hive TRV Hallway/set
      - zigbee2mqtt/Hive TRV Entrance/set
      - zigbee2mqtt/Hive TRV Guestroom/set
      - zigbee2mqtt/Hive TRV Conservatory/set
      - zigbee2mqtt/Hive TRV Garage/set
action:
  - service: logbook.log
    data:
      name: Boiler control
      message: >
        Boost started — {{ room }}, {{ temperature }}°C for {{ duration }} minutes
      entity_id: switch.boiler_switch

  # Send single MQTT payload to each TRV in the selected room
  # All four fields must be in one message — firmware requirement
  - repeat:
      for_each: "{{ room_trvs[room] }}"
      sequence:
        - service: mqtt.publish
          data:
            topic: "{{ repeat.item }}"
            payload: >
              {"system_mode":"emergency_heating",
               "temperature_setpoint_hold":1,
               "temperature_setpoint_hold_duration":{{ duration }},
               "occupied_heating_setpoint":{{ temperature }}}

---

alias: Heating — Cancel boost
description: >
  Cancels active boost on all TRVs in the selected room.
  Returns them to heat mode following their schedule.
mode: single
trigger:
  - platform: state
    entity_id: input_boolean.heating_boost_active
    to: "off"
variables:
  room: "{{ states('input_select.heating_boost_room') }}"
  room_trvs:
    Living Room:
      - zigbee2mqtt/Hive TRV TV/set
      - zigbee2mqtt/Hive TRV Bay/set
      - zigbee2mqtt/Hive TRV Dining/set
    Bedroom:
      - zigbee2mqtt/Hive TRV Bedroom/set
    Kitchen:
      - zigbee2mqtt/Hive TRV Kitchen/set
    Office:
      - zigbee2mqtt/Hive TRV Office/set
    Hallway:
      - zigbee2mqtt/Hive TRV Hallway/set
    Entrance:
      - zigbee2mqtt/Hive TRV Entrance/set
    Guest Room:
      - zigbee2mqtt/Hive TRV Guestroom/set
    Conservatory:
      - zigbee2mqtt/Hive TRV Conservatory/set
    Garage:
      - zigbee2mqtt/Hive TRV Garage/set
    All Rooms:
      - zigbee2mqtt/Hive TRV TV/set
      - zigbee2mqtt/Hive TRV Bay/set
      - zigbee2mqtt/Hive TRV Dining/set
      - zigbee2mqtt/Hive TRV Bedroom/set
      - zigbee2mqtt/Hive TRV Kitchen/set
      - zigbee2mqtt/Hive TRV Office/set
      - zigbee2mqtt/Hive TRV Hallway/set
      - zigbee2mqtt/Hive TRV Entrance/set
      - zigbee2mqtt/Hive TRV Guestroom/set
      - zigbee2mqtt/Hive TRV Conservatory/set
      - zigbee2mqtt/Hive TRV Garage/set
action:
  - repeat:
      for_each: "{{ room_trvs[room] }}"
      sequence:
        - service: mqtt.publish
          data:
            topic: "{{ repeat.item }}"
            payload: >
              {"system_mode":"heat",
               "temperature_setpoint_hold":0,
               "temperature_setpoint_hold_duration":0}

  - service: logbook.log
    data:
      name: Boiler control
      message: "Boost cancelled — {{ room }}"
      entity_id: switch.boiler_switch
