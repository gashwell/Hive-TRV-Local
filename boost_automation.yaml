# Per-room boost automations
# One trigger per room — each input_boolean fires boost for its room independently
# Rooms can be boosted simultaneously

alias: Heating — Boost Living Room
mode: restart
trigger:
  - platform: state
    entity_id: input_boolean.boost_living_room
    to: "on"
action:
  - service: logbook.log
    data:
      name: Boiler control
      message: >
        Boost started — Living Room,
        {{ states('input_number.boost_living_room_temp') | float }}°C
        for {{ states('input_number.boost_living_room_duration') | int }} minutes
      entity_id: switch.boiler_switch
  - repeat:
      for_each:
        - zigbee2mqtt/Hive TRV TV/set
        - zigbee2mqtt/Hive TRV Bay/set
        - zigbee2mqtt/Hive TRV Dining/set
      sequence:
        - service: mqtt.publish
          data:
            topic: "{{ repeat.item }}"
            payload: >
              {"system_mode":"emergency_heating",
               "temperature_setpoint_hold":1,
               "temperature_setpoint_hold_duration":{{ states('input_number.boost_living_room_duration') | int }},
               "occupied_heating_setpoint":{{ states('input_number.boost_living_room_temp') | float }}}

---

alias: Heating — Cancel Boost Living Room
mode: single
trigger:
  - platform: state
    entity_id: input_boolean.boost_living_room
    to: "off"
action:
  - repeat:
      for_each:
        - zigbee2mqtt/Hive TRV TV/set
        - zigbee2mqtt/Hive TRV Bay/set
        - zigbee2mqtt/Hive TRV Dining/set
      sequence:
        - service: mqtt.publish
          data:
            topic: "{{ repeat.item }}"
            payload: '{"system_mode":"heat","temperature_setpoint_hold":0,"temperature_setpoint_hold_duration":0}'
  - service: logbook.log
    data:
      name: Boiler control
      message: Boost cancelled — Living Room
      entity_id: switch.boiler_switch

