alias: Boiler MQTT raw monitor
description: >
  Monitors the raw MQTT topics for the ZBMINIR2 and Z2M bridge events.
  Logs everything to the boiler switch logbook entry.
mode: parallel
max: 20
trigger:
  - platform: mqtt
    topic: zigbee2mqtt/Boiler Switch
  - platform: mqtt
    topic: zigbee2mqtt/Boiler Switch/set
  - platform: mqtt
    topic: zigbee2mqtt/bridge/state
  - platform: mqtt
    topic: zigbee2mqtt/bridge/event
action:
  - service: logbook.log
    data:
      name: Boiler MQTT
      message: >
        [{{ trigger.topic }}]
        {{ trigger.payload }}
        at {{ now().strftime('%H:%M:%S') }}
      entity_id: switch.boiler_switch
