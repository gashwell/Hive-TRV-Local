# Boiler demand automation
# Add to automations.yaml or import via Settings → Automations → Import
#
# Turns switch.boiler_switch ON when any TRV is actively heating
# Turns it OFF when all TRVs are idle (with a 5-minute hold-off)

alias: Boiler demand control
description: >
  Fires the ZBMINIR2 relay when any TRV calls for heat.
  5-minute delay before turning off to prevent boiler short-cycling.
mode: restart

trigger:
  - platform: state
    entity_id:
      - climate.hive_trv_group_living_room
      - climate.hive_trv_kitchen
      - climate.hive_trv_bedroom
      - climate.hive_trv_office
      - climate.hive_trv_guestroom
      - climate.hive_trv_garage
      - climate.hive_trv_conservatory
      - climate.hive_trv_entrance
      - climate.hive_trv_hallway
    attribute: hvac_action

variables:
  any_heating: >
    {{ states | selectattr('entity_id', 'in', [
      'climate.hive_trv_group_living_room',
      'climate.hive_trv_kitchen',
      'climate.hive_trv_bedroom',
      'climate.hive_trv_office',
      'climate.hive_trv_guestroom',
      'climate.hive_trv_garage',
      'climate.hive_trv_conservatory',
      'climate.hive_trv_entrance',
      'climate.hive_trv_hallway'
    ]) | selectattr('attributes.hvac_action', 'eq', 'heating')
    | list | count > 0 }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ any_heating }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: switch.boiler_switch
      - conditions:
          - condition: template
            value_template: "{{ not any_heating }}"
        sequence:
          - delay:
              minutes: 5
          - condition: template
            value_template: >
              {{ states | selectattr('entity_id', 'in', [
                'climate.hive_trv_group_living_room',
                'climate.hive_trv_kitchen',
                'climate.hive_trv_bedroom',
                'climate.hive_trv_office',
                'climate.hive_trv_guestroom',
                'climate.hive_trv_garage',
                'climate.hive_trv_conservatory',
                'climate.hive_trv_entrance',
                'climate.hive_trv_hallway'
              ]) | selectattr('attributes.hvac_action', 'eq', 'heating')
              | list | count == 0 }}
          - service: switch.turn_off
            target:
              entity_id: switch.boiler_switch
