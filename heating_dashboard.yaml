  # ────────────────────────────────────────────────────────────────────────────
  # VIEW 2 — TRV SETTINGS
  # Verified entity IDs from Z2M
  # ────────────────────────────────────────────────────────────────────────────
  - title: TRV Settings
    path: trv-settings
    icon: mdi:tune
    type: sections
    sections:

      - type: grid
        columns: 1
        cards:
          - type: entities
            title: TV Radiator
            entities:
              - entity: climate.hive_trv_tv
                name: Temperature / mode
              - type: section
                label: Schedule and mode
              - entity: select.hive_trv_tv_programming_operation_mode
                name: Programme mode
              - entity: select.hive_trv_tv_keypad_lockout
                name: Keypad lock
              - type: section
                label: Window detection
              - entity: switch.hive_trv_tv_window_open_feature
                name: Window open detection
              - entity: switch.hive_trv_tv_window_open_external
                name: Window open (override)
              - type: section
                label: Radiator setup
              - entity: switch.hive_trv_tv_heat_available
                name: Heat available (off = summer mode)
              - entity: switch.hive_trv_tv_radiator_covered
                name: Radiator covered (room sensor mode)
              - entity: switch.hive_trv_tv_thermostat_orientation
                name: Orientation (on = vertical)
              - entity: switch.hive_trv_tv_viewing_direction
                name: Display upside-down
              - type: section
                label: Calibration
              - entity: number.hive_trv_tv_regulation_setpoint_offset
                name: Temperature calibration (−2.5 to +2.5°C)
              - entity: number.hive_trv_tv_max_heat_setpoint_limit
                name: Max temperature limit
              - entity: number.hive_trv_tv_algorithm_scale_factor
                name: Control aggressiveness (1=fast, 10=slow)
              - type: section
                label: Adaptation
              - entity: switch.hive_trv_tv_adaptation_run_settings
                name: Auto nightly adaptation run
              - entity: select.hive_trv_tv_adaptation_run_control
                name: Adaptation run (initiate / cancel)
              - type: section
                label: Status
              - entity: binary_sensor.hive_trv_tv_heat_required
                name: Heat required
              - entity: binary_sensor.hive_trv_tv_preheat_status
                name: Preheating

