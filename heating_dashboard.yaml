  # ────────────────────────────────────────────────────────────────────────────
  # VIEW 3 — DIAGNOSTICS
  # ────────────────────────────────────────────────────────────────────────────
  - title: Diagnostics
    path: diagnostics
    icon: mdi:chart-line
    type: sections
    sections:

      # Boiler state
      - type: grid
        columns: 1
        cards:
          - type: tile
            entity: switch.boiler_switch
            name: Boiler
            icon: mdi:fire
            color: deep-orange
            tap_action:
              action: toggle

      # Heating demand log — shows which TRV triggered with temp and demand %
      - type: grid
        columns: 1
        cards:
          - type: logbook
            title: Heating demand log — which TRV triggered
            entities:
              - climate.hive_trv_tv
              - climate.hive_trv_bay
              - climate.hive_trv_dining
              - climate.hive_trv_kitchen
              - climate.hive_trv_bedroom
              - climate.hive_trv_office
              - climate.hive_trv_guestroom
              - climate.hive_trv_garage
              - climate.hive_trv_conservatory
              - climate.hive_trv_entrance
              - climate.hive_trv_hallway
              - switch.boiler_switch
            hours_to_show: 24

      # Boiler switch history graph
      - type: grid
        columns: 1
        cards:
          - type: history-graph
            title: Boiler on/off — last 24 hours
            hours_to_show: 24
            entities:
              - entity: switch.boiler_switch
                name: Boiler

      # All TRV demand history
      - type: grid
        columns: 1
        cards:
          - type: history-graph
            title: TRV heat demand — last 24 hours
            hours_to_show: 24
            entities:
              - entity: binary_sensor.hive_trv_tv_heat_required
                name: TV
              - entity: binary_sensor.hive_trv_bay_heat_required
                name: Bay
              - entity: binary_sensor.hive_trv_dining_heat_required
                name: Dining
              - entity: binary_sensor.hive_trv_bedroom_heat_required
                name: Bedroom
              - entity: binary_sensor.hive_trv_kitchen_heat_required
                name: Kitchen
              - entity: binary_sensor.hive_trv_office_heat_required
                name: Office
              - entity: binary_sensor.hive_trv_hallway_heat_required
                name: Hallway
              - entity: binary_sensor.hive_trv_entrance_heat_required
                name: Entrance
              - entity: binary_sensor.hive_trv_guestroom_heat_required
                name: Guest room
              - entity: binary_sensor.hive_trv_conservatory_heat_required
                name: Conservatory
              - entity: binary_sensor.hive_trv_garage_heat_required
                name: Garage

      # Current demand state — all TRVs at a glance
      - type: grid
        columns: 1
        cards:
          - type: custom:mushroom-template-card
            primary: Current heat demand
            secondary: >
              {% set heating = namespace(trvs=[]) %}
              {% set trvs = {
                'climate.hive_trv_tv':           'TV',
                'climate.hive_trv_bay':          'Bay',
                'climate.hive_trv_dining':       'Dining',
                'climate.hive_trv_bedroom':      'Bedroom',
                'climate.hive_trv_kitchen':      'Kitchen',
                'climate.hive_trv_office':       'Office',
                'climate.hive_trv_hallway':      'Hallway',
                'climate.hive_trv_entrance':     'Entrance',
                'climate.hive_trv_guestroom':    'Guest Room',
                'climate.hive_trv_conservatory': 'Conservatory',
                'climate.hive_trv_garage':       'Garage'
              } %}
              {% for entity_id, name in trvs.items() %}
                {% if is_state_attr(entity_id, 'hvac_action', 'heating') %}
                  {% set heating.trvs = heating.trvs + [name] %}
                {% endif %}
              {% endfor %}
              {% if heating.trvs | count > 0 %}
                {{ heating.trvs | count }} heating: {{ heating.trvs | join(', ') }}
              {% else %}
                No TRVs demanding heat
              {% endif %}
            icon: mdi:fire
            icon_color: >
              {% if states | selectattr('entity_id', 'in', [
                'climate.hive_trv_tv','climate.hive_trv_bay','climate.hive_trv_dining',
                'climate.hive_trv_kitchen','climate.hive_trv_bedroom','climate.hive_trv_office',
                'climate.hive_trv_hallway','climate.hive_trv_entrance','climate.hive_trv_guestroom',
                'climate.hive_trv_conservatory','climate.hive_trv_garage'
              ]) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 %}
                red
              {% else %}
                grey
              {% endif %}

      # Per-TRV demand grid
      - type: grid
        columns: 3
        cards:
          - type: custom:mushroom-template-card
            primary: TV
            secondary: >
              {{ state_attr('climate.hive_trv_tv', 'current_temperature') | round(1) }}° →
              {{ state_attr('climate.hive_trv_tv', 'temperature') | round(1) }}°
              ({{ state_attr('climate.hive_trv_tv', 'pi_heating_demand') | int }}%)
            icon: mdi:radiator
            icon_color: "{{ 'red' if is_state_attr('climate.hive_trv_tv', 'hvac_action', 'heating') else 'grey' }}"
            badge_icon: "{{ 'mdi:fire' if is_state_attr('climate.hive_trv_tv', 'hvac_action', 'heating') else '' }}"
            badge_color: red

          - type: custom:mushroom-template-card
            primary: Bay
            secondary: >
              {{ state_attr('climate.hive_trv_bay', 'current_temperature') | round(1) }}° →
              {{ state_attr('climate.hive_trv_bay', 'temperature') | round(1) }}°
              ({{ state_attr('climate.hive_trv_bay', 'pi_heating_demand') | int }}%)
            icon: mdi:radiator
            icon_color: "{{ 'red' if is_state_attr('climate.hive_trv_bay', 'hvac_action', 'heating') else 'grey' }}"
            badge_icon: "{{ 'mdi:fire' if is_state_attr('climate.hive_trv_bay', 'hvac_action', 'heating') else '' }}"
            badge_color: red

          - type: custom:mushroom-template-card
