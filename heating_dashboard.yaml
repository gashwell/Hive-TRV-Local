title: Heating
views:

  # ────────────────────────────────────────────────────────────────────────────
  # VIEW 1 — MAIN HEATING
  # ────────────────────────────────────────────────────────────────────────────
  - title: Heating
    path: heating
    icon: mdi:radiator
    type: sections
    sections:

      # Boiler status
      - type: grid
        columns: 1
        cards:
          - type: tile
            entity: switch.boiler_switch
            name: Boiler
            icon: mdi:fire
            color: deep-orange
            tap_action:
              action: toggle

      # Living room group — thermostat card controls all 3 TRVs together
      - type: grid
        columns: 1
        cards:
          - type: thermostat
            entity: climate.hive_trv_group_living_room
            name: Living Room (TV · Bay · Dining)
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - heat
                  - "off"

      # Living room — individual TRVs with flame badge when heating
      - type: grid
        columns: 3
        cards:
          - type: custom:mushroom-climate-card
            entity: climate.hive_trv_tv
            name: TV
            show_temperature_control: true
            hvac_modes:
              - heat
              - "off"
            card_mod:
              style: |
                mushroom-badge-icon$:
                  ha-icon {
                    display: {{ is_state_attr('climate.hive_trv_tv', 'hvac_action', 'heating') | iif('inline-flex', 'none') }};
                    --icon-color: rgb(220, 38, 38);
                  }
          - type: custom:mushroom-climate-card
            entity: climate.hive_trv_bay
            name: Bay
            show_temperature_control: true
            hvac_modes:
              - heat
              - "off"
            card_mod:
              style: |
                mushroom-badge-icon$:
                  ha-icon {
                    display: {{ is_state_attr('climate.hive_trv_bay', 'hvac_action', 'heating') | iif('inline-flex', 'none') }};
                    --icon-color: rgb(220, 38, 38);
                  }
          - type: custom:mushroom-climate-card
            entity: climate.hive_trv_dining
            name: Dining
            show_temperature_control: true
            hvac_modes:
              - heat
              - "off"
            card_mod:
              style: |
                mushroom-badge-icon$:
                  ha-icon {
                    display: {{ is_state_attr('climate.hive_trv_dining', 'hvac_action', 'heating') | iif('inline-flex', 'none') }};
                    --icon-color: rgb(220, 38, 38);
                  }


      # Individual rooms — flame badge shows when heating
      - type: grid
        columns: 2
        cards:
          - type: custom:mushroom-climate-card
            entity: climate.hive_trv_bedroom
            name: Bedroom
            show_temperature_control: true
            hvac_modes:
              - heat
              - "off"
            card_mod:
              style: |
                mushroom-badge-icon$:
                  ha-icon {
                    display: {{ is_state_attr('climate.hive_trv_bedroom', 'hvac_action', 'heating') | iif('inline-flex', 'none') }};
                    --icon-color: rgb(220, 38, 38);
                  }
          - type: custom:mushroom-climate-card
            entity: climate.hive_trv_kitchen
