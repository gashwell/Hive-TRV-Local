alias: Boiler spurious ON guard
description: >
  Intercepts spurious ON messages on the ZBMINIR2 MQTT topic (e.g. from
  Z2M OTA checks) and immediately publishes OFF back if no TRV has demand.
  This prevents the switch ever turning on without genuine heat demand.
mode: single
trigger:
  - platform: mqtt
    topic: zigbee2mqtt/Boiler Switch
    value_template: "{{ value_json.state }}"
    payload: "ON"
condition:
  - condition: template
    value_template: >
      {{ states | selectattr('entity_id', 'in', [
          'binary_sensor.hive_trv_tv_heat_required',
          'binary_sensor.hive_trv_bay_heat_required',
          'binary_sensor.hive_trv_dining_heat_required',
          'binary_sensor.hive_trv_kitchen_heat_required',
          'binary_sensor.hive_trv_bedroom_heat_required',
          'binary_sensor.hive_trv_office_heat_required',
          'binary_sensor.hive_trv_guestroom_heat_required',
          'binary_sensor.hive_trv_garage_heat_required',
          'binary_sensor.hive_trv_conservatory_heat_required',
          'binary_sensor.hive_trv_entrance_heat_required',
          'binary_sensor.hive_trv_hallway_heat_required'
      ]) | selectattr('state', 'eq', 'on') | list | count == 0 }}
action:
  - service: mqtt.publish
    data:
      topic: zigbee2mqtt/Boiler Switch/set
      payload: '{"state":"OFF"}'
  - service: logbook.log
    data:
      name: Boiler monitor
      message: >
        Spurious ON intercepted (no TRV demand) — published OFF to Z2M
      entity_id: switch.boiler_switch
