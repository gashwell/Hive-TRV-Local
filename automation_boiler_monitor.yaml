alias: Boiler switch monitor
description: >
  Logs every state change on switch.boiler_switch with full context —
  user, automation, script or external source.
mode: parallel
max: 10
trigger:
  - platform: state
    entity_id: switch.boiler_switch
action:
  - service: logbook.log
    data:
      name: Boiler monitor
      message: >
        Boiler → {{ trigger.to_state.state | upper }}
        | context_id: {{ trigger.to_state.context.id }}
        | user_id: {{ trigger.to_state.context.user_id | default('none') }}
        | parent_id: {{ trigger.to_state.context.parent_id | default('none') }}
        | at {{ now().strftime('%H:%M:%S') }}
      entity_id: switch.boiler_switch
