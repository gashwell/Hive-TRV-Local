# Per-room boost helpers
# Create each via Settings → Helpers
# Toggle (input_boolean) + two Numbers (input_number) per room
#
# Rooms: living_room, bedroom, kitchen, office, hallway,
#         entrance, guestroom, conservatory, garage

input_boolean:
  boost_living_room:
    name: Boost Living Room
    icon: mdi:fire
  boost_bedroom:
    name: Boost Bedroom
    icon: mdi:fire
  boost_kitchen:
    name: Boost Kitchen
    icon: mdi:fire
  boost_office:
    name: Boost Office
    icon: mdi:fire
  boost_hallway:
    name: Boost Hallway
    icon: mdi:fire
  boost_entrance:
    name: Boost Entrance
    icon: mdi:fire
  boost_guestroom:
    name: Boost Guest Room
    icon: mdi:fire
  boost_conservatory:
    name: Boost Conservatory
    icon: mdi:fire
  boost_garage:
    name: Boost Garage
    icon: mdi:fire

input_number:
  boost_living_room_temp:
    name: Boost Living Room temp
    min: 16
    max: 28
    step: 0.5
    unit_of_measurement: °C
    icon: mdi:thermometer
    initial: 22
  boost_living_room_duration:
    name: Boost Living Room duration
    min: 10
    max: 120
    step: 10
    unit_of_measurement: min
    icon: mdi:timer
    initial: 60

  boost_bedroom_temp:
